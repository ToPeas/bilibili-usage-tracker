<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B 站使用时长</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <div class="hero-row">
          <div class="hero-brand">
            <div class="hero-logo">B</div>
            <div>
              <div class="hero-eyebrow">本机浏览器 · 今日</div>
              <h1 class="hero-today" id="todayDuration">--</h1>
              <div class="hero-all-row">
                <span class="hero-all-label">全设备总计 · 今日</span>
                <span class="hero-all-value" id="todayAllDevicesDuration">--</span>
              </div>
            </div>
          </div>
          <div class="hero-actions">
            <button class="ghost-btn" id="openOptions" title="设置">⚙</button>
          </div>
        </div>
        <div class="hero-chips">
          <span class="chip chip-state" id="stateChip">检测中…</span>
          <span class="chip chip-host" id="hostChip">未在 B 站</span>
          <span class="chip chip-db" id="dbChip">D1：未配置</span>
        </div>
      </header>

      <section class="card">
        <div class="card-header">
          <div>
            <h2 class="card-title">使用时长趋势</h2>
            <p class="card-sub" id="rangeSummary">最近 7 天</p>
          </div>
          <div class="range-tabs" id="rangeTabs">
            <button data-range="7" class="active">7 天</button>
            <button data-range="30">30 天</button>
            <button data-range="90">90 天</button>
            <button data-range="180">半年</button>
          </div>
        </div>
        <div class="chart-wrap">
          <canvas id="trendChart" width="640" height="220"></canvas>
        </div>
        <div class="legend" id="trendLegend"></div>
      </section>

      <section class="card">
        <div class="card-header">
          <div>
            <h2 class="card-title" id="dayTitle">选中某天</h2>
            <p class="card-sub" id="daySub">点击柱子可查看「24 小时分布 + 各设备」</p>
          </div>
        </div>
        <div class="chart-wrap small">
          <canvas id="hourChart" width="640" height="160"></canvas>
        </div>
        <ul class="device-list" id="deviceList"></ul>
      </section>

      <section class="card" id="installHintCard" hidden>
        <div class="card-header">
          <div>
            <h2 class="card-title">提示</h2>
            <p class="card-sub" id="installHint">如刚装好/重载插件，请刷新一下 B 站标签页让 content script 注入</p>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="card-header">
          <div>
            <h2 class="card-title">操作</h2>
            <p class="card-sub" id="lastUploadInfo">尚未上传</p>
          </div>
        </div>
        <div class="action-row">
          <button class="primary-btn" id="uploadNow">立即上传</button>
          <button class="secondary-btn" id="testD1">测试 D1</button>
          <button class="secondary-btn" id="openOptions2">设置</button>
        </div>
        <div class="status-line" id="uploadStatus"></div>
      </section>

      <section class="card debug-card">
        <div class="card-header">
          <div>
            <h2 class="card-title">调试信息</h2>
            <p class="card-sub">每 2 秒刷新，便于排查「不在计时」原因</p>
          </div>
          <button class="secondary-btn small-btn" id="toggleDebug">展开</button>
        </div>
        <ul class="debug-list" id="debugList" hidden></ul>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
